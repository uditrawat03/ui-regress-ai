<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile Fixture</title>
  <style>
    * { box-sizing: border-box; animation: none !important; transition: none !important; }
    body { margin: 0; font-family: Arial, sans-serif; background:#eef2f7; color:#172033; }
    .page { max-width: 980px; margin: 34px auto; }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .save { padding:12px 20px; background:#0f6fec; color:white; border-radius:8px; font-weight:700; }
    .grid { display:grid; grid-template-columns:280px 1fr; gap:20px; }
    .panel { background:white; border:1px solid #d7e0ec; border-radius:12px; padding:22px; box-shadow:0 5px 14px rgba(0,0,0,.05); }
    .avatar { width:110px; height:110px; border-radius:50%; background:#dbeafe; display:grid; place-items:center; font-size:42px; color:#1d4ed8; margin:0 auto 16px; }
    .bio { line-height:1.6; color:#53627a; }
    .field { margin:16px 0; }
    .label { font-size:13px; color:#65748b; margin-bottom:6px; }
    .input { border:1px solid #bac7d9; border-radius:8px; min-height:46px; padding:13px; }
    .preferences { margin-top:18px; padding:16px; border-radius:10px; background:#f8fafc; line-height:1.8; }
  </style>
</head>
<body>
<div class="page">
  <div class="header"><div><h1>Profile settings</h1><span>Manage account information</span></div><div class="save" data-uiregress-target="save-button">Save changes</div></div>
  <div class="grid">
    <section class="panel" data-uiregress-target="profile-card">
      <div class="avatar" data-uiregress-target="avatar">UR</div>
      <h2>Udit Rawat</h2>
      <p class="bio" data-uiregress-target="profile-bio">Senior engineer building developer tools and AI systems.</p>
    </section>
    <section class="panel" data-uiregress-target="settings-panel">
      <h2>Account</h2>
      <div class="field"><div class="label">Display name</div><div class="input" data-uiregress-target="display-name">Udit Rawat</div></div>
      <div class="field"><div class="label">Role</div><div class="input">Senior Software Engineer</div></div>
      <div class="preferences" data-uiregress-target="preferences">Email notifications: enabled<br>Weekly report: enabled<br>Theme: system default</div>
    </section>
  </div>
</div>
</body>
</html>
