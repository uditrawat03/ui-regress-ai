[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uiregress-ai"
version = "0.1.0.dev0"
description = "GPU-powered semantic visual regression testing with PyTorch"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Udit" }]
dependencies = [
  "torch>=2.3",
  "torchvision>=0.18",
  "typer>=0.12",
  "pillow>=10",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]
dataset = [
  "playwright>=1.63,<2",
]

[project.scripts]
uiregress = "uiregress.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/uiregress"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

torchvision = [
    { index = "pytorch-cu132", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true